<!doctype html>
<html lang="zh-Hant">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <meta name="theme-color" content="#0d2b3a" />
  <meta name="description" content="Circus Lucky Draw — 馬戲團幸運抽獎 PWA" />
  <link rel="manifest" href="./manifest.webmanifest" />
  <link rel="icon" type="image/svg+xml" href="./icons/icon.svg" />
  <link rel="apple-touch-icon" href="./icons/icon-1024.png" />
  <title>Lucky Draw · 幸運抽獎</title>
</head>
<body>
  <canvas id="dust" aria-hidden="true"></canvas>
  <div class="beams" aria-hidden="true"><div class="beam b1"></div><div class="beam b2"></div></div>

  <header id="topbar">
    <div class="brand">
      <svg class="brand-star" viewBox="0 0 24 24" width="26" height="26" aria-hidden="true"><path fill="currentColor" d="M12 1l2.6 6.9L22 9l-5.4 4.8L18.2 22 12 17.8 5.8 22l1.6-8.2L2 9l7.4-1.1z"/></svg>
      <h1>LUCKY DRAW</h1>
      <span class="brand-sub" data-i18n="tagline"></span>
    </div>
    <div class="top-actions">
      <div id="mcpLamp" class="lamp" role="status"><i></i><span id="mcpLampText"></span></div>
      <button id="installBtn" class="top-btn hidden" data-i18n="install"></button>
      <div id="authSlot" class="auth-slot hidden"></div>
      <button id="soundBtn" class="top-btn sound" aria-pressed="true">
        <svg id="soundIconOn" viewBox="0 0 24 24" width="18" height="18"><path fill="currentColor" d="M3 9v6h4l5 5V4L7 9H3zm13.5 3a4.5 4.5 0 0 0-2.5-4v8a4.5 4.5 0 0 0 2.5-4zM14 3.2v2.1a7 7 0 0 1 0 13.4v2.1a9 9 0 0 0 0-17.6z"/></svg>
        <svg id="soundIconOff" viewBox="0 0 24 24" width="18" height="18" class="hidden"><path fill="currentColor" d="M3 9v6h4l5 5V4L7 9H3zm18.6 3l2.1-2.1-1.4-1.4-2.1 2.1-2.1-2.1-1.4 1.4 2.1 2.1-2.1 2.1 1.4 1.4 2.1-2.1 2.1 2.1 1.4-1.4-2.1-2.1z"/></svg>
        <span id="soundLabel"></span>
      </button>
      <button id="settingsBtn" class="top-btn gear" aria-haspopup="dialog">
        <svg viewBox="0 0 24 24" width="20" height="20" aria-hidden="true"><path fill="currentColor" d="M12 8a4 4 0 1 0 0 8 4 4 0 0 0 0-8zm9.4 5.5l-2.1-.4a7.6 7.6 0 0 1-.6 1.5l1.2 1.7-1.9 1.9-1.7-1.2c-.5.3-1 .5-1.5.6l-.4 2.1h-2.7l-.4-2.1a7.6 7.6 0 0 1-1.5-.6l-1.7 1.2-1.9-1.9 1.2-1.7c-.3-.5-.5-1-.6-1.5l-2.1-.4v-2.7l2.1-.4c.1-.5.3-1 .6-1.5L4.2 6.4l1.9-1.9 1.7 1.2c.5-.3 1-.5 1.5-.6l.4-2.1h2.7l.4 2.1c.5.1 1 .3 1.5.6l1.7-1.2 1.9 1.9-1.2 1.7c.3.5.5 1 .6 1.5l2.1.4v2.7z"/></svg>
        <span data-i18n="settings"></span>
      </button>
    </div>
  </header>
  <div class="valance" aria-hidden="true"></div>
  <div class="bulbwire" aria-hidden="true"></div>

  <main>
    <section id="stage">
      <div class="curtain left" aria-hidden="true"></div>
      <div class="curtain right" aria-hidden="true"></div>
      <div id="wheelWrap">
        <div class="wheel-shadow" aria-hidden="true"></div>
        <canvas id="wheel"></canvas>
        <button id="goBtn" aria-label="Spin"><span>GO</span><span class="go-sub" id="goSub"></span></button>
      </div>
      <p id="stageHint"></p>
      <div id="stageMeta" aria-live="polite">
        <span id="metaCount" class="meta-pill"></span>
        <span id="metaLast" class="meta-pill gold"></span>
      </div>
    </section>
  </main>

  <div id="settingsScrim" class="hidden" aria-hidden="true"></div>
  <div id="settingsPage" class="hidden" role="dialog" aria-modal="true" aria-labelledby="settingsTitle">
    <header class="set-head">
      <svg viewBox="0 0 24 24" width="24" height="24" aria-hidden="true"><path fill="currentColor" d="M12 8a4 4 0 1 0 0 8 4 4 0 0 0 0-8zm9.4 5.5l-2.1-.4a7.6 7.6 0 0 1-.6 1.5l1.2 1.7-1.9 1.9-1.7-1.2c-.5.3-1 .5-1.5.6l-.4 2.1h-2.7l-.4-2.1a7.6 7.6 0 0 1-1.5-.6l-1.7 1.2-1.9-1.9 1.2-1.7c-.3-.5-.5-1-.6-1.5l-2.1-.4v-2.7l2.1-.4c.1-.5.3-1 .6-1.5L4.2 6.4l1.9-1.9 1.7 1.2c.5-.3 1-.5 1.5-.6l.4-2.1h2.7l.4 2.1c.5.1 1 .3 1.5.6l1.7-1.2 1.9 1.9-1.2 1.7c.3.5.5 1 .6 1.5l2.1.4v2.7z"/></svg>
      <h2 id="settingsTitle" data-i18n="settings"></h2>
      <button id="settingsClose" class="set-close" aria-label="Close">
        <svg viewBox="0 0 24 24" width="20" height="20" aria-hidden="true"><path fill="currentColor" d="M18.3 5.7L12 12l6.3 6.3-1.4 1.4L10.6 13.4 4.3 19.7 2.9 18.3 9.2 12 2.9 5.7 4.3 4.3l6.3 6.3 6.3-6.3z"/></svg>
        <span data-i18n="close"></span>
      </button>
    </header>
    <div id="settingsScroll">
      <section class="card set-section">
        <h3 data-i18n="showSection"></h3>
        <div class="setting">
          <label for="durationRange" data-i18n="spinDuration"></label>
          <output id="durationVal">6</output>
          <input id="durationRange" type="range" min="3" max="12" step="0.5" value="6">
        </div>
        <div class="setting">
          <label for="confettiRange" data-i18n="confettiDensity"></label>
          <output id="confettiVal">70</output>
          <input id="confettiRange" type="range" min="0" max="100" step="5" value="70">
        </div>
        <div class="setting">
          <label for="bulbRange" data-i18n="bulbSpeed"></label>
          <output id="bulbVal">1.0×</output>
          <input id="bulbRange" type="range" min="0" max="3" step="0.1" value="1">
        </div>
        <div class="setting toggle-row">
          <label for="lightToggle" data-i18n="lightShow"></label>
          <label class="switch"><input id="lightToggle" type="checkbox" checked><i></i></label>
        </div>
        <div class="setting toggle-row">
          <label for="tickToggle" data-i18n="tickSound"></label>
          <label class="switch"><input id="tickToggle" type="checkbox" checked><i></i></label>
        </div>
      </section>

      <section class="card set-section">
        <h3 data-i18n="musicSection"></h3>
        <div class="setting toggle-row">
          <label for="soundToggle" data-i18n="sound"></label>
          <label class="switch"><input id="soundToggle" type="checkbox" checked><i></i></label>
        </div>
        <div class="music-block">
          <div class="music-row"><span data-i18n="bgmSlot"></span><select id="musicBgm" aria-label="Background music source"></select></div>
          <div class="music-row"><span data-i18n="spinSlot"></span><select id="musicSpin" aria-label="Spin music source"></select></div>
          <div class="music-row"><span data-i18n="winSlot"></span><select id="musicWin" aria-label="Victory music source"></select></div>
          <p class="music-hint" data-i18n="musicFallback"></p>
          <div class="track-lib">
            <h4 data-i18n="trackLib"></h4>
            <ul id="trackList" class="track-list"></ul>
            <div class="track-add">
              <input id="trackUrl" class="track-name" type="text" data-i18n-ph="trackUrlPh" aria-label="Track source">
              <input id="trackName" class="track-name" type="text" data-i18n-ph="trackNamePh" aria-label="Track name">
              <button id="trackAddBtn" class="btn small gold" data-i18n="trackAdd"></button>
            </div>
          </div>
        </div>
      </section>

      <section class="card set-section">
        <h3 data-i18n="interfaceSection"></h3>
        <div class="setting select-row">
          <label for="langSelect" data-i18n="language"></label>
          <select id="langSelect">
            <option value="zh">繁體中文</option>
            <option value="en">English</option>
          </select>
        </div>
        <div class="setting select-row">
          <label for="tvSelect" data-i18n="tvMode"></label>
          <select id="tvSelect">
            <option value="auto" data-i18n="tvAuto"></option>
            <option value="on" data-i18n="tvOn"></option>
            <option value="off" data-i18n="tvOff"></option>
          </select>
        </div>
        <p class="music-hint" data-i18n="tvHint"></p>
      </section>

      <section class="card set-section">
        <h3>
          <span data-i18n="participants"></span>
          <span id="countBadge" class="badge">0</span>
        </h3>
        <textarea id="namesInput" rows="3" data-i18n-ph="namesPlaceholder" spellcheck="false"></textarea>
        <div class="row">
          <button id="addBtn" class="btn red" data-i18n="add"></button>
          <button id="clearBtn" class="btn ghost" data-i18n="clearAll"></button>
        </div>
        <div class="range-block">
          <label data-i18n="numberRange"></label>
          <div class="range-row">
            <div class="stepper"><button data-step="min:-1" aria-label="decrease">−</button><input id="rangeMin" type="number" value="1" min="0" max="99999"><button data-step="min:1" aria-label="increase">+</button></div>
            <span class="dash">–</span>
            <div class="stepper"><button data-step="max:-1" aria-label="decrease">−</button><input id="rangeMax" type="number" value="100" min="0" max="99999"><button data-step="max:1" aria-label="increase">+</button></div>
            <button id="genBtn" class="btn gold small" data-i18n="generate"></button>
          </div>
        </div>
        <div id="chips" class="chips"></div>
      </section>

      <section class="card set-section">
        <h3>
          <span data-i18n="history"></span>
          <span id="historyBadge" class="badge">0</span>
        </h3>
        <div class="row">
          <button id="exportBtn" class="btn ghost small" data-i18n="exportCsv"></button>
          <button id="resetBtn" class="btn ghost small" data-i18n="resetAll"></button>
        </div>
        <ol id="historyList" class="history"></ol>
        <p id="historyEmpty" class="empty" data-i18n="historyEmpty"></p>
      </section>

      <section class="card set-section mcp-card">
        <h3 data-i18n="mcpTitle"></h3>
        <p class="mcp-line"><span id="mcpDot" class="dot"></span><code id="mcpEndpoint">ws://localhost:4173</code></p>
        <p class="mcp-hint" data-i18n="mcpHint"></p>
        <div class="row">
          <button id="keygenBtn" class="btn gold small" data-i18n="keygenBtn"></button>
        </div>
        <div class="key-lib">
          <h4 data-i18n="keyListTitle"></h4>
          <ul id="keyList" class="key-list"></ul>
          <p id="keyListEmpty" class="mcp-hint" data-i18n="keyListEmpty"></p>
        </div>
      </section>
    </div>
  </div>

  <div id="winnerOverlay" class="hidden" role="dialog" aria-modal="true">
    <div id="winnerCard">
      <div class="wc-marquee" aria-hidden="true"></div>
      <p class="wc-title" data-i18n="winner"></p>
      <p id="winnerName"></p>
      <div class="wc-actions">
        <button id="confirmBtn" class="btn gold" data-i18n="confirm"></button>
      </div>
      <p class="wc-hint" data-i18n="wcHint"></p>
    </div>
  </div>

  <div id="keyOverlay" class="hidden" role="dialog" aria-modal="true">
    <div id="keyCard">
      <div id="keyNameStage">
        <p class="wc-title" data-i18n="keyNameTitle"></p>
        <input id="keyNameInput" type="text" maxlength="40" data-i18n-ph="keyNamePh" aria-label="Key name">
        <div class="wc-actions">
          <button id="keyCreateBtn" class="btn gold" data-i18n="keyCreate"></button>
          <button id="keyCancelBtn" class="btn redline" data-i18n="keyCancel"></button>
        </div>
      </div>
      <div id="keyResultStage" class="hidden">
        <p class="wc-title" data-i18n="keyTitle"></p>
        <p id="keyLabel" class="key-label"></p>
        <code id="keyValue"></code>
        <div class="wc-actions">
          <button id="keyCopyBtn" class="btn gold" data-i18n="copyKey"></button>
          <button id="keyCloseBtn" class="btn redline" data-i18n="closeKey"></button>
        </div>
        <p class="wc-hint" data-i18n="keyHint"></p>
      </div>
    </div>
  </div>

  <canvas id="confetti" aria-hidden="true"></canvas>
  <div id="toasts" aria-live="polite"></div>
  <div id="ytHost" aria-hidden="true"></div>

  <script type="module" src="/src/main.js"></script>
</body>
</html>
