<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Lucky Draw · 連線中</title>
<style>
  :root { --navy:#0d2b3a; --navy2:#123a4d; --red:#e8404d; --red-deep:#b3273a; --cream:#fdf0d5; --gold:#f6b93b; --gold-deep:#d99a1f; --teal:#17606f; --maroon:#7a1f2b; }
  * { margin:0; padding:0; box-sizing:border-box; }
  body {
    min-height:100vh; display:flex; align-items:center; justify-content:center;
    background: radial-gradient(120% 80% at 50% 0%, var(--navy2), var(--navy) 60%);
    font-family:"Nunito","Segoe UI",system-ui,sans-serif; color:var(--cream);
    overflow:hidden;
  }
  .valance { position:fixed; top:0; left:0; right:0; height:44px;
    background: radial-gradient(circle 22px at 22px 0, var(--red) 98%, transparent) repeat-x;
    background-size:44px 44px; filter:drop-shadow(0 4px 6px rgba(0,0,0,.4)); }
  .card { text-align:center; padding:48px 56px; max-width:760px;
    background:linear-gradient(180deg,var(--cream),#f3e3c0); color:var(--maroon);
    border:3px solid var(--gold-deep); border-radius:24px;
    box-shadow:0 24px 60px rgba(0,0,0,.55), inset 0 0 0 5px rgba(255,255,255,.4); }
  .wheel { width:120px; height:120px; margin:0 auto 22px; border-radius:50%;
    background:conic-gradient(var(--red) 0 45deg, var(--cream) 45deg 90deg, var(--red) 90deg 135deg, var(--cream) 135deg 180deg, var(--red) 180deg 225deg, var(--cream) 225deg 270deg, var(--red) 270deg 315deg, var(--cream) 315deg 360deg);
    border:8px solid var(--teal); box-shadow:0 0 0 4px var(--gold-deep), 0 10px 24px rgba(0,0,0,.35);
    animation:spin 3.2s linear infinite; }
  @keyframes spin { to { transform:rotate(360deg); } }
  h1 { font-size:34px; letter-spacing:1px; margin-bottom:10px; color:var(--red-deep); }
  p { font-size:18px; line-height:1.6; font-weight:700; }
  code { display:inline-block; margin-top:14px; font-size:16px; background:rgba(13,43,58,.12);
    border:2px dashed var(--gold-deep); border-radius:999px; padding:6px 18px; color:var(--teal); font-weight:800; }
  button { margin-top:26px; font:800 20px/1 "Nunito","Segoe UI",sans-serif; letter-spacing:.5px;
    color:var(--maroon); background:linear-gradient(180deg,var(--gold),var(--gold-deep));
    border:none; border-radius:999px; padding:16px 42px; cursor:pointer;
    box-shadow:0 4px 0 #a8770f, 0 10px 24px rgba(217,154,31,.4); }
  button:focus-visible { outline:4px solid var(--red); outline-offset:4px;
    box-shadow:0 4px 0 #a8770f, 0 0 0 9px rgba(232,64,77,.3), 0 0 30px rgba(246,185,59,.6); }
  .count { margin-top:16px; font-size:15px; color:#8a7a5c; font-weight:700; }
</style>
</head>
<body>
<div class="valance"></div>
<div class="card">
  <div class="wheel"></div>
  <h1>馬戲團未開鑼 · Show not reachable</h1>
  <p>電視暫時連唔到抽獎主機。<br>The TV cannot reach the draw machine right now.</p>
  <code>https://luckydraw.rileywu.org</code>
  <br>
  <button id="retry" onclick="location.replace('https://luckydraw.rileywu.org/')">重試 · Retry</button>
  <p class="count">自動重試 Auto retry in <span id="n">10</span>s</p>
</div>
<script>
  document.getElementById('retry').focus();
  var n = 10;
  setInterval(function () {
    n -= 1;
    document.getElementById('n').textContent = n;
    if (n <= 0) location.replace('https://luckydraw.rileywu.org/');
  }, 1000);
</script>
</body>
</html>
